<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>My Flight Dashboard</h1>
    <div class="stats">
      <div class="stat"><span id="stat-flights">0</span><label>Flights</label></div>
      <div class="stat"><span id="stat-trips">0</span><label>Trips</label></div>
      <div class="stat"><span id="stat-airports">0</span><label>Airports</label></div>
      <div class="stat"><span id="stat-miles">0</span><label>Miles</label></div>
    </div>
  </header>

  <main>
    <div id="map"></div>
    <aside id="sidebar">
      <h2>Trips</h2>
      <ul id="trip-list"></ul>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="flights.js"></script>
  <script src="app.js"></script>
</body>
</html>
